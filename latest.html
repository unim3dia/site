<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2ad35">
  <title>Aylon Ben-Ami - Latest Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,650..900&display=swap" rel="stylesheet">
  <style>
    :root{
      --ui-bg:#f2ad35;
      --ui-ink:#173448;
      --ui-paper:#fff;
      --display:"Fraunces",Georgia,serif;
      --sans:"DM Sans",sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--ui-bg)}
    body{min-height:100%;margin:0;background:var(--ui-bg);color:var(--ui-ink);font-family:var(--sans);font-weight:600;overflow-x:hidden;transition:background .45s ease,color .45s ease}
    body.modal-open{overflow:hidden}
    button,a{font:inherit;color:inherit}
    button{border:0}
    img{display:block;max-width:100%}
    [hidden]{display:none!important}
    ::selection{background:var(--ui-ink);color:var(--ui-bg)}

    .cursor-trace{position:fixed;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
    .site-header{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;color:var(--ui-ink);transition:color .35s ease}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-size:.75rem;font-weight:800}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid currentColor;border-radius:50%;font-family:var(--display);font-size:1rem;font-weight:800;background:var(--ui-paper);color:#171712;transition:background .35s ease}
    .site-nav{display:flex;align-items:center;gap:3px;padding:4px;border:1px solid color-mix(in srgb,var(--ui-ink) 18%,transparent);border-radius:999px;background:color-mix(in srgb,var(--ui-bg) 82%,transparent);backdrop-filter:blur(14px);transition:background .35s ease,border-color .35s ease}
    .site-nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-size:.66rem;font-weight:800}
    .site-nav a[aria-current="page"]{background:var(--ui-ink);color:var(--ui-bg)}

    #projects{--page-field:linear-gradient(#f2ad35,#61c8c4,#d5eb63,#809df3,#ffc86a,#ff9f91);position:relative;background:var(--page-field);isolation:isolate;overflow:hidden}
    #projects::before{content:"";position:absolute;inset:-.35% 0;background:var(--page-field);opacity:.2;filter:saturate(1.32) hue-rotate(-2deg);transform-origin:50% 50%;animation:fieldBreath 18s ease-in-out infinite alternate;pointer-events:none;z-index:0}
    #projects::after{content:"";position:absolute;inset:-1% 0;background:radial-gradient(ellipse at 8% 8%,rgba(255,86,57,.36) 0 4%,transparent 15%),radial-gradient(ellipse at 90% 23%,rgba(50,111,222,.3) 0 5%,transparent 17%),radial-gradient(ellipse at 12% 41%,rgba(255,104,55,.29) 0 5%,transparent 16%),radial-gradient(ellipse at 88% 57%,rgba(43,210,181,.32) 0 5%,transparent 17%),radial-gradient(ellipse at 10% 74%,rgba(255,81,72,.27) 0 5%,transparent 17%),radial-gradient(ellipse at 86% 91%,rgba(255,211,62,.32) 0 5%,transparent 16%);filter:blur(34px) saturate(1.25);opacity:.72;transform-origin:50% 50%;animation:fieldDrift 24s ease-in-out infinite alternate;pointer-events:none;z-index:0}
    .project-section{--section-bg:#f1ad35;--next-bg:#61c8c4;--section-ink:#102e3d;--section-accent:#ff6949;--section-accent-2:#1aa7a1;--section-paper:#fff;position:relative;z-index:1;overflow:hidden;background:transparent;color:var(--section-ink);isolation:isolate}
    .project-section::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 8% 35%,color-mix(in srgb,var(--section-accent) 78%,transparent) 0 10%,transparent 36%),radial-gradient(circle at 91% 43%,color-mix(in srgb,var(--section-accent-2) 82%,transparent) 0 13%,transparent 39%),radial-gradient(ellipse at 69% 20%,rgba(255,255,255,.38) 0 8%,transparent 34%);filter:blur(18px) saturate(1.15);opacity:.88;mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 82%,transparent 100%);animation:atmosphereBreathe 14s ease-in-out infinite alternate;animation-play-state:paused;z-index:-2}
    .project-section::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 26% 30%,color-mix(in srgb,var(--section-accent-2) 54%,transparent) 0 8%,transparent 34%),radial-gradient(ellipse at 76% 66%,color-mix(in srgb,var(--section-accent) 52%,transparent) 0 11%,transparent 38%);filter:blur(42px) saturate(1.2);opacity:.4;mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 84%,transparent 100%);animation:atmosphereDrift 19s ease-in-out infinite alternate;animation-play-state:paused;z-index:-1}
    .project-section::before,.project-section::after{display:none}
    .project-section.is-active::before,.project-section.is-active::after{animation-play-state:running}
    .project-section:nth-child(even)::before{animation-delay:-6s}
    .project-section:nth-child(3n)::after{animation-delay:-9s}
    .section-grain{position:absolute;inset:0;pointer-events:none;opacity:.045;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");mix-blend-mode:multiply;mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent)}
    .section-inner{position:relative;z-index:3;width:min(1120px,100%);margin:0 auto;padding:72px 28px 34px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
    .project-section:not(:first-child) .section-inner{padding-top:54px}
    .latest-page-heading{margin:0 0 8px;font-family:var(--sans);font-size:clamp(1.25rem,2.2vw,2rem);font-weight:800;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:var(--section-ink)}
    .project-title{max-width:900px;margin:0;font-family:var(--display);font-size:clamp(2.25rem,4.15vw,4rem);font-weight:800;line-height:.92;letter-spacing:-.035em;color:var(--section-ink)}
    .project-description{width:min(680px,calc(100% - 28px));margin:0;color:#11120f;font-size:clamp(.9rem,1.25vw,1.05rem);font-weight:650;line-height:1.48}
    .project-labels{width:min(760px,calc(100% - 28px));display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:5px}
    .project-label{padding:7px 12px;border:1px solid color-mix(in srgb,var(--section-ink) 25%,transparent);border-radius:999px;background:rgba(255,255,255,.34);color:#11120f;font-size:.69rem;font-weight:800;line-height:1;letter-spacing:.012em;backdrop-filter:blur(10px)}

    .deck-shell{position:relative;width:min(88vw,660px);height:390px;display:grid;place-items:center}
    .deck{position:relative;width:100%;height:350px;touch-action:pan-y;user-select:none}
    .project-card{--tx:0px;--ty:0px;--rot:0deg;--scale:1;--lift:0px;--card-width:600px;--card-ratio:16 / 9;position:absolute;left:50%;top:45%;width:min(var(--card-width),calc(100vw - 72px));aspect-ratio:var(--card-ratio);padding:7px;background:#fff;color:#171712;border:0;border-radius:16px;box-shadow:0 22px 58px rgba(25,25,20,.22),0 2px 0 rgba(255,255,255,.8) inset;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty) + var(--lift))) rotate(var(--rot)) scale(var(--scale));transform-origin:50% 74%;transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .28s ease,box-shadow .22s ease;overflow:hidden;will-change:transform}
    .project-card[data-shape="phone"]{--card-width:180px;border-radius:32px;padding:7px}
    .project-card[data-shape="portrait"]{--card-width:210px;border-radius:20px}
    .project-card[data-shape="square"]{--card-width:315px;border-radius:18px}
    .project-card[data-shape="browser"]{--card-width:460px;border-radius:12px}
    .project-card[data-shape="landscape"]{--card-width:550px;border-radius:12px}
    .project-card.is-front{cursor:grab}
    .project-card.is-side{cursor:pointer}
    .project-card.is-side:hover{--lift:-4px;box-shadow:0 28px 68px rgba(20,18,13,.28)}
    .project-card.is-dragging{cursor:grabbing;transition:none;box-shadow:0 40px 90px rgba(20,18,13,.34)}
    .deck.is-dragging .project-card{transition:none}
    .card-media{position:absolute;inset:7px;overflow:hidden;border-radius:10px;background:transparent}
    .project-card[data-shape="phone"] .card-media{inset:7px;border-radius:28px;background:#10110e}
    .project-card[data-shape="phone"] .card-media::after{content:"";position:absolute;left:50%;top:6px;width:58px;height:14px;border-radius:999px;background:#090a08;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
    .project-card[data-shape="portrait"] .card-media{border-radius:13px}
    .card-media img{width:100%;height:100%;object-fit:cover;pointer-events:none;background:transparent}
    .expand-image{position:absolute;right:15px;bottom:15px;z-index:4;width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(20,20,18,.22);border-radius:50%;background:rgba(255,253,248,.88);color:#171712;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.18);opacity:0;transform:scale(.8);transition:opacity .2s ease,transform .2s ease,background .2s ease;backdrop-filter:blur(8px)}
    .project-card.is-front .expand-image{opacity:1;transform:scale(1)}
    .project-card:not(.is-front) .expand-image{pointer-events:none}
    .expand-image:hover{background:var(--section-accent);color:#fff}
    .expand-image svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .deck-controls{position:absolute;left:50%;bottom:0;z-index:14;transform:translateX(-50%);color:#171712}
    .deck-next{position:relative;width:43px;height:43px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:#171712;cursor:pointer;overflow:visible;transition:transform .22s cubic-bezier(.22,1,.36,1)}
    .deck-next-arrow{position:relative;z-index:2;width:39px;height:39px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,var(--section-accent),var(--section-accent-2));color:#fff;font-size:1rem;overflow:hidden;box-shadow:0 5px 16px color-mix(in srgb,var(--section-accent) 45%,transparent);transition:transform .32s cubic-bezier(.22,1,.36,1),box-shadow .32s ease}
    .deck-next-arrow svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .deck-next:hover{transform:translateY(-3px) scale(1.06)}
    .deck-next:hover .deck-next-arrow{box-shadow:0 8px 22px color-mix(in srgb,var(--section-accent) 62%,transparent)}
    .deck-next:hover .deck-next-arrow svg{animation:deckArrowLoop .92s linear infinite}
    .deck-next:focus-visible{outline:2px solid var(--section-ink);outline-offset:4px}
    .deck-next:active{transform:translateY(0) scale(.94)}
    .deck-next.is-advancing .deck-next-arrow{animation:nextArrowPulse .46s cubic-bezier(.22,1,.36,1)}

    .grab-cursor{position:fixed;left:0;top:0;z-index:40;width:44px;height:51px;pointer-events:none;opacity:0;transform:translate3d(-150px,-150px,0);transition:opacity .1s linear;will-change:transform}
    .grab-cursor.is-visible{opacity:1}
    .grab-cursor svg{width:100%;height:100%;transform:translate(-32%,-25%) rotate(-7deg);transform-origin:48% 64%;filter:drop-shadow(0 7px 2px rgba(0,0,0,.22));transition:transform .12s ease}
    .grab-cursor.is-grabbing svg{transform:translate(-32%,-20%) rotate(8deg) scale(.82)}
    .has-grab-cursor .project-card.is-front,.has-grab-cursor .project-card.is-side{cursor:none}

    .image-lightbox{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:34px 86px;background:rgba(8,10,12,.84);backdrop-filter:blur(18px);cursor:zoom-out;animation:lightboxIn .2s ease both}
    .lightbox-stage{width:100%;height:100%;display:grid;place-items:center;pointer-events:none}
    .image-lightbox img{width:auto;height:auto;max-width:min(88vw,1600px);max-height:89svh;object-fit:contain;border:5px solid rgba(255,255,255,.96);border-radius:14px;box-shadow:0 36px 100px rgba(0,0,0,.55);cursor:default;pointer-events:auto;transition:opacity .14s ease,transform .22s cubic-bezier(.22,1,.36,1)}
    .image-lightbox.is-changing img{opacity:.38;transform:scale(.985)}
    .lightbox-close{position:fixed;right:22px;top:20px;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#fffdf8;color:#171712;font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.28)}
    .lightbox-nav{position:fixed;top:50%;z-index:2;width:52px;height:52px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:1.5rem;cursor:pointer;transform:translateY(-50%);backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(0,0,0,.18);transition:background .18s ease,transform .18s ease}
    .lightbox-nav:hover{background:rgba(255,255,255,.3);transform:translateY(-50%) scale(1.06)}
    .lightbox-nav.previous{left:20px}
    .lightbox-nav.next{right:20px}
    @keyframes lightboxIn{from{opacity:0}to{opacity:1}}
    @keyframes nextArrowPulse{0%{transform:translateX(0) scale(1)}45%{transform:translateX(8px) scale(.86)}46%{transform:translateX(-7px) scale(.86)}100%{transform:translateX(0) scale(1)}}
    @keyframes deckArrowLoop{0%{opacity:0;transform:translateX(-22px)}8%{opacity:1}50%{opacity:1;transform:translateX(0)}91%{opacity:1;transform:translateX(22px)}92%,100%{opacity:0;transform:translateX(22px)}}
    @keyframes fieldBreath{0%{opacity:.12;filter:saturate(1.18) hue-rotate(-3deg);transform:translateY(-.12%) scaleY(1.002)}48%{opacity:.29;filter:saturate(1.52) hue-rotate(2deg);transform:translateY(.08%) scaleY(1.01)}100%{opacity:.18;filter:saturate(1.38) hue-rotate(4deg);transform:translateY(.16%) scaleY(1.006)}}
    @keyframes fieldDrift{0%{opacity:.5;filter:blur(30px) saturate(1.12) hue-rotate(-2deg);transform:translate3d(-1.2%,0,0) scale(1.006)}52%{opacity:.82;filter:blur(43px) saturate(1.48) hue-rotate(3deg);transform:translate3d(1.1%,.18%,0) scale(1.022)}100%{opacity:.62;filter:blur(36px) saturate(1.3) hue-rotate(5deg);transform:translate3d(-.4%,-.12%,0) scale(1.014)}}
    @keyframes atmosphereBreathe{0%{transform:translate3d(-1.5%,1%,0) scale(1);filter:blur(18px) saturate(1.08);opacity:.76}48%{transform:translate3d(1%,-1.5%,0) scale(1.08);filter:blur(27px) saturate(1.32);opacity:1}100%{transform:translate3d(2.5%,1%,0) scale(1.13);filter:blur(22px) saturate(1.42);opacity:.84}}
    @keyframes atmosphereDrift{0%{transform:translate3d(-3%,2%,0) scale(1);opacity:.28}55%{transform:translate3d(3%,-2%,0) scale(1.13);opacity:.68}100%{transform:translate3d(-1%,-4%,0) scale(1.2);opacity:.46}}

    @media(max-width:760px){
      .cursor-trace,.grab-cursor{display:none}
      .site-header{padding:12px 10px}
      .brand span:last-child{display:none}
      .site-nav{gap:1px;padding:3px}
      .site-nav a{padding:7px 9px;font-size:.58rem}
      .project-section::before{inset:0;background:radial-gradient(circle at 92% 44%,color-mix(in srgb,var(--section-accent-2) 78%,transparent) 0 20%,transparent 54%),radial-gradient(circle at 0% 68%,color-mix(in srgb,var(--section-accent) 68%,transparent) 0 12%,transparent 44%)}
      .section-inner{padding:66px 14px 24px;gap:7px}
      .project-section:not(:first-child) .section-inner{padding-top:40px}
      .latest-page-heading{margin-bottom:6px;font-size:1.08rem;letter-spacing:.08em}
      .project-title{font-size:clamp(2.1rem,9vw,3.05rem);line-height:.92}
      .project-description{width:min(350px,calc(100% - 24px));font-size:.82rem;line-height:1.42}
      .project-labels{width:min(360px,calc(100% - 20px));gap:6px;margin-top:4px}
      .project-label{padding:6px 9px;font-size:.61rem}
      .deck-shell{width:100%;height:375px}
      .deck{height:335px}
      #clone .deck-shell,#howmany .deck-shell{height:270px}
      #clone .deck,#howmany .deck{height:230px}
      .project-card{width:min(var(--card-width),calc(100vw - 42px));padding:6px}
      .project-card[data-shape="phone"]{--card-width:178px;border-radius:29px;padding:6px}
      .project-card[data-shape="portrait"]{--card-width:200px;border-radius:17px}
      .project-card[data-shape="square"]{--card-width:286px;border-radius:15px}
      .project-card[data-shape="browser"]{--card-width:320px}
      .project-card[data-shape="landscape"]{--card-width:330px}
      .card-media{inset:6px}
      .project-card[data-shape="phone"] .card-media{inset:6px;border-radius:23px}
      .project-card[data-shape="phone"] .card-media::after{width:48px;height:12px;top:5px}
      .expand-image{right:11px;bottom:11px;width:31px;height:31px}
      .deck-controls{bottom:0}
      .deck-next{width:39px;height:39px}
      .deck-next-arrow{width:36px;height:36px}
      .image-lightbox{padding:64px 12px 76px}
      .image-lightbox img{max-width:94vw;max-height:78svh;border-width:4px;border-radius:10px}
      .lightbox-close{right:12px;top:max(12px,env(safe-area-inset-top));width:38px;height:38px}
      .lightbox-nav{top:auto;bottom:max(14px,env(safe-area-inset-bottom));width:46px;height:46px;transform:none}
      .lightbox-nav:hover{transform:scale(1.05)}
      .lightbox-nav.previous{left:calc(50% - 58px)}
      .lightbox-nav.next{right:calc(50% - 58px)}
    }
    @media(max-width:380px){
      .project-title{font-size:2.15rem}
      .deck-shell{height:350px}
      .deck{height:312px}
      .project-card[data-shape="phone"]{--card-width:164px}
      .project-card[data-shape="portrait"]{--card-width:185px}
      .project-card[data-shape="square"]{--card-width:265px}
      .project-card[data-shape="browser"]{--card-width:298px}
      .project-card[data-shape="landscape"]{--card-width:305px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <canvas class="cursor-trace" id="cursorTrace" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="brand" href="#clone"><span class="brand-mark">AB</span><span>Aylon Ben-Ami</span></a>
    <nav class="site-nav" aria-label="Site sections">
      <a href="latest.html" aria-current="page">Latest</a>
      <a href="index.html">Video</a>
      <a href="ai.html">AI</a>
    </nav>
  </header>

  <main id="projects"></main>

  <div class="grab-cursor" id="grabCursor" aria-hidden="true">
    <svg viewBox="0 0 100 116" xmlns="http://www.w3.org/2000/svg">
      <path d="M25 66V31c0-6 4-10 9-10s9 4 9 10v18-30c0-6 4-10 10-10s10 4 10 10v30-23c0-6 4-10 9-10s9 4 9 10v27-15c0-6 4-10 9-10s9 4 9 10v31c0 24-17 41-40 41-14 0-24-7-31-18L10 75c-4-6-2-13 3-17 5-3 11-1 15 4l11 14" fill="#fff" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M42 65c5-5 11-7 17-5M60 59c5-4 11-4 17-1M34 94c12 7 28 8 42 1" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M34 101c12 6 25 7 38 2l-1 10H35z" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="image-lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="Expanded project image" hidden>
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close expanded image">&times;</button>
    <button class="lightbox-nav previous" id="lightboxPrevious" type="button" aria-label="Previous image">&larr;</button>
    <div class="lightbox-stage"><img id="lightboxImage" alt=""></div>
    <button class="lightbox-nav next" id="lightboxNext" type="button" aria-label="Next image">&rarr;</button>
  </div>

  <script>
    if('scrollRestoration' in history) history.scrollRestoration='manual';
    try{history.replaceState(null,'',location.href.split(/[?#]/)[0]);}catch(error){}
    const forceLatestTop=()=>scrollTo(0,0);
    forceLatestTop();
    addEventListener('pageshow',()=>requestAnimationFrame(forceLatestTop));

    const ratios={phone:'1290 / 2340',portrait:'2 / 3',square:'1 / 1',browser:'1.3 / 1',landscape:'16 / 9'};
    const cards=(folder,files,defaultShape='landscape')=>files.map(item=>{
      const [file,shape=defaultShape,ratio=ratios[shape]]=Array.isArray(item)?item:[item];
      return {src:`latest-assets/${folder}/${file}`,shape,ratio};
    });

    const projects=[
      {
        id:'clone',short:'Clone',title:'Clone',
        description:'Lyric music video made with AI for the Leo Kottke and Mike Gordon classic "Clone." Nano Banana 2, GPT2, Seedance 2, Google Omni and Veo 3.1.',
        labels:['Creative Direction','AI Filmmaking','Character Continuity','Editorial Design'],
        colors:{bg:'#f2ad35',ink:'#173448',muted:'#173448',accent:'#ff6245',accent2:'#42b9aa',paper:'#fff'},
        cards:cards('Clone Stills for Publishing',[
          '1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg',

    function positionFor(relative,length,frontWidth,cardWidth){
      if(relative===0) return {x:0,y:0,r:0,s:1,z:10,o:1,front:true};
      if(relative===1){
        const scale=.95;
        const offset=stackOffset(frontWidth,cardWidth,scale,sideOffset());
        return {x:offset,y:13,r:3.8,s:scale,z:7,o:1,side:'next'};
      }
      if(relative===length-1){
        const scale=.92;
        const offset=stackOffset(frontWidth,cardWidth,scale,sideOffset());
        return {x:-offset,y:17,r:-3.8,s:scale,z:8,o:1,side:'previous'};
      }
      if(relative===2){
        const scale=.85;
        const reveal=sideOffset()+(innerWidth<700?22:36);
        const offset=stackOffset(frontWidth,cardWidth,scale,reveal);
        return {x:offset,y:29,r:7,s:scale,z:5,o:.72,deep:'next'};
      }
      if(relative===length-2){
        const scale=.82;
        const reveal=sideOffset()+(innerWidth<700?22:36);
        const offset=stackOffset(frontWidth,cardWidth,scale,reveal);
        return {x:-offset,y:34,r:-7,s:scale,z:6,o:.64,deep:'previous'};
      }
      const side=relative<length/2?1:-1;
      return {x:side*20,y:42,r:side*8,s:.74,z:2,o:0};
    }

    function layoutDeck(deck){
      const state=deckStates.get(deck);
      const projectCards=[...deck.querySelectorAll('.project-card')];
      const frontCard=projectCards[state.index];
      const frontWidth=frontCard.offsetWidth;
      projectCards.forEach((card,index)=>{
        const relative=(index-state.index+projectCards.length)%projectCards.length;
        const position=positionFor(relative,projectCards.length,frontWidth,card.offsetWidth);
        card.style.setProperty('--tx',`${position.x}px`);
        card.style.setProperty('--ty',`${position.y}px`);
        card.style.setProperty('--rot',`${position.r}deg`);
        card.style.setProperty('--scale',position.s);
        card.style.zIndex=position.z;
        card.style.opacity=position.o;
        card.classList.toggle('is-front',!!position.front);
        card.classList.toggle('is-side',!!position.side);
        card.classList.toggle('is-next',position.side==='next');
        card.classList.toggle('is-previous',position.side==='previous');
        card.classList.toggle('is-deep',!!position.deep);
        card.style.pointerEvents=position.front||position.side?'auto':'none';
        card.tabIndex=position.front||position.side?0:-1;

    function previewDeckDrag(deck,state,direction,progress,dx){
      const cards=[...deck.querySelectorAll('.project-card')];
      const currentFront=cards[state.index];
      const targetIndex=(state.index+direction+cards.length)%cards.length;
      const targetFront=cards[targetIndex];
      const lead=Math.max(-30,Math.min(30,dx*.24));

      cards.forEach((card,index)=>{
        const currentRelative=(index-state.index+cards.length)%cards.length;
        const targetRelative=(index-targetIndex+cards.length)%cards.length;
        const current=positionFor(currentRelative,cards.length,currentFront.offsetWidth,card.offsetWidth);
        const target=positionFor(targetRelative,cards.length,targetFront.offsetWidth,card.offsetWidth);
        const extraLead=index===state.index?lead:0;

        card.style.setProperty('--tx',`${mix(current.x,target.x,progress)+extraLead}px`);
        card.style.setProperty('--ty',`${mix(current.y,target.y,progress)}px`);
        card.style.setProperty('--rot',`${mix(current.r,target.r,progress)}deg`);
        card.style.setProperty('--scale',mix(current.s,target.s,progress));
        card.style.opacity=mix(current.o,target.o,progress);
        card.style.zIndex=progress>.46?target.z:current.z;
      });
    }

    function cycleDeck(deck,direction){
      const state=deckStates.get(deck);
      state.index=(state.index+direction+deck.children.length)%deck.children.length;
      loadDeckWindow(deck,state.index);
      layoutDeck(deck);

          event.stopPropagation();

        card.addEventListener('click',()=>{
          const state=deckStates.get(deck);
          if(performance.now()<state.suppressClickUntil) return;

          if(card.classList.contains('is-previous')) cycleDeck(deck,-1);

          if((event.key==='Enter'||event.key===' ')&&card.classList.contains('is-side')){

    function initCursorTrace(){
      if(!matchMedia('(pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      const canvas=document.getElementById('cursorTrace');
      const ctx=canvas.getContext('2d');
      const ratio=Math.min(devicePixelRatio,1.5);
      let width=innerWidth,height=innerHeight,previous=null,strokes=[];
      const resize=()=>{
        width=innerWidth;height=innerHeight;
        canvas.width=Math.ceil(width*ratio);canvas.height=Math.ceil(height*ratio);
        ctx.setTransform(ratio,0,0,ratio,0,0);
      };
      addEventListener('resize',resize);
      addEventListener('pointermove',event=>{
        if(previous){
          const speed=Math.min(60,Math.hypot(event.clientX-previous.x,event.clientY-previous.y));
          if(speed>2) strokes.push({x1:previous.x,y1:previous.y,x2:event.clientX,y2:event.clientY,width:18+speed*.26,life:1,color:tracePalette[strokes.length%2]});
          if(strokes.length>14) strokes.splice(0,strokes.length-14);
        }
        previous={x:event.clientX,y:event.clientY};
      });
      addEventListener('pointerleave',()=>{previous=null;strokes=[]});
      const draw=()=>{
        ctx.clearRect(0,0,width,height);
        ctx.lineCap='round';ctx.lineJoin='round';
        strokes=strokes.filter(stroke=>{
          stroke.life-=.16;
          if(stroke.life<=0) return false;
          ctx.globalAlpha=stroke.life*.23;
          ctx.strokeStyle=stroke.color;
          ctx.lineWidth=stroke.width*(.72+stroke.life*.28);
          ctx.beginPath();ctx.moveTo(stroke.x1,stroke.y1);ctx.lineTo(stroke.x2,stroke.y2);ctx.stroke();
          return true;
        });
        ctx.globalAlpha=1;
        requestAnimationFrame(draw);
      };
      resize();draw();
    }
    initCursorTrace();

    activateSection(sections[0]);
  </script>
